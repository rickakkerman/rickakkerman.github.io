<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 1010" font-family="Inter, system-ui, Arial, sans-serif">
  <defs>
    <marker id="ahRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e23b2c"/></marker>
    <marker id="ahBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f80d8"/></marker>
    <marker id="ahGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a9d57"/></marker>
    <marker id="ahNavy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5f96"/></marker>
    <marker id="ahGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6c88"/></marker>
    <marker id="ahYellow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f2b705"/></marker>

    <!-- blue neural net (110 x 90) -->
    <g id="netBlue">
      <g stroke="#aac4e6" stroke-width="1.5">
        <line x1="12" y1="25" x2="55" y2="12"/><line x1="12" y1="25" x2="55" y2="45"/><line x1="12" y1="25" x2="55" y2="78"/>
        <line x1="12" y1="65" x2="55" y2="12"/><line x1="12" y1="65" x2="55" y2="45"/><line x1="12" y1="65" x2="55" y2="78"/>
        <line x1="55" y1="12" x2="98" y2="25"/><line x1="55" y1="12" x2="98" y2="65"/>
        <line x1="55" y1="45" x2="98" y2="25"/><line x1="55" y1="45" x2="98" y2="65"/>
        <line x1="55" y1="78" x2="98" y2="25"/><line x1="55" y1="78" x2="98" y2="65"/>
      </g>
      <g fill="#cfe1f6" stroke="#3f73b8" stroke-width="2">
        <circle cx="12" cy="25" r="9"/><circle cx="12" cy="65" r="9"/>
        <circle cx="55" cy="12" r="9"/><circle cx="55" cy="45" r="9"/><circle cx="55" cy="78" r="9"/>
        <circle cx="98" cy="25" r="9"/><circle cx="98" cy="65" r="9"/>
      </g>
    </g>

    <!-- green neural net (110 x 90) -->
    <g id="netGreen">
      <g stroke="#b2d8ba" stroke-width="1.5">
        <line x1="12" y1="25" x2="55" y2="12"/><line x1="12" y1="25" x2="55" y2="45"/><line x1="12" y1="25" x2="55" y2="78"/>
        <line x1="12" y1="65" x2="55" y2="12"/><line x1="12" y1="65" x2="55" y2="45"/><line x1="12" y1="65" x2="55" y2="78"/>
        <line x1="55" y1="12" x2="98" y2="25"/><line x1="55" y1="12" x2="98" y2="65"/>
        <line x1="55" y1="45" x2="98" y2="25"/><line x1="55" y1="45" x2="98" y2="65"/>
        <line x1="55" y1="78" x2="98" y2="25"/><line x1="55" y1="78" x2="98" y2="65"/>
      </g>
      <g fill="#d4ecd9" stroke="#4a9d57" stroke-width="2">
        <circle cx="12" cy="25" r="9"/><circle cx="12" cy="65" r="9"/>
        <circle cx="55" cy="12" r="9"/><circle cx="55" cy="45" r="9"/><circle cx="55" cy="78" r="9"/>
        <circle cx="98" cy="25" r="9"/><circle cx="98" cy="65" r="9"/>
      </g>
    </g>

    <!-- database with lock (56 x 74) -->
    <g id="db">
      <path d="M2,12 V58 A26,9 0 0 0 54,58 V12" fill="#d2e5fb" stroke="#4a82c8" stroke-width="2"/>
      <ellipse cx="28" cy="12" rx="26" ry="9" fill="#e2eefc" stroke="#4a82c8" stroke-width="2"/>
      <path d="M2,29 A26,9 0 0 0 54,29" fill="none" stroke="#4a82c8" stroke-width="1.6"/>
      <path d="M2,44 A26,9 0 0 0 54,44" fill="none" stroke="#4a82c8" stroke-width="1.6"/>
      <circle cx="47" cy="58" r="12.5" fill="#3b82d6"/>
      <path d="M43,57.5 v-2.2 a4,4 0 0 1 8,0 v2.2" fill="none" stroke="#fff" stroke-width="1.8"/>
      <rect x="42" y="57" width="10" height="8" rx="1.6" fill="#fff"/>
    </g>
  </defs>

  <!-- ===== connectors (drawn first, under the boxes) ===== -->
  <!-- dataset -> local model -->
  <g stroke="#f2b705" stroke-width="2.6" marker-end="url(#ahYellow)">
    <line x1="200" y1="792" x2="200" y2="702"/>
    <line x1="570" y1="792" x2="570" y2="702"/>
    <line x1="940" y1="792" x2="940" y2="702"/>
  </g>

  <!-- left: red (1) + blue (3) -->
  <line x1="190" y1="512" x2="430" y2="270" stroke="#e23b2c" stroke-width="3" marker-end="url(#ahRed)"/>
  <line x1="224" y1="506" x2="454" y2="278" stroke="#2f80d8" stroke-width="3" marker-start="url(#ahBlue)"/>
  <!-- right: red (1) + blue (3) -->
  <line x1="950" y1="512" x2="710" y2="270" stroke="#e23b2c" stroke-width="3" marker-end="url(#ahRed)"/>
  <line x1="916" y1="506" x2="686" y2="278" stroke="#2f80d8" stroke-width="3" marker-start="url(#ahBlue)"/>
  <!-- middle: red (1) + blue + green (2) -->
  <line x1="556" y1="512" x2="556" y2="272" stroke="#e23b2c" stroke-width="3" marker-end="url(#ahRed)"/>
  <line x1="584" y1="512" x2="584" y2="272" stroke="#2f80d8" stroke-width="3" marker-start="url(#ahBlue)"/>


  <!-- ===== central server ===== -->
  <rect x="405" y="70" width="330" height="195" rx="16" fill="#eaf7ef" stroke="#d2ebda" stroke-width="1.5"/>
  <text x="570" y="116" text-anchor="middle" font-size="31" font-weight="700" fill="#15213b">Central Server</text>
  <use href="#netGreen" transform="translate(507,138) scale(1.15)"/>

  <!-- ===== local models ===== -->
  <g>
    <rect x="97.5" y="515" width="205" height="180" rx="16" fill="#eaf1fc" stroke="#d3e0f5" stroke-width="1.5"/>
    <text x="200" y="558" text-anchor="middle" font-size="26" font-weight="700" fill="#15213b">Local Model</text>
    <use href="#netBlue" transform="translate(145,572)"/>
  </g>
  <g>
    <rect x="467.5" y="515" width="205" height="180" rx="16" fill="#eaf1fc" stroke="#d3e0f5" stroke-width="1.5"/>
    <text x="570" y="558" text-anchor="middle" font-size="26" font-weight="700" fill="#15213b">Local Model</text>
    <use href="#netBlue" transform="translate(515,572)"/>
  </g>
  <g>
    <rect x="837.5" y="515" width="205" height="180" rx="16" fill="#eaf1fc" stroke="#d3e0f5" stroke-width="1.5"/>
    <text x="940" y="558" text-anchor="middle" font-size="26" font-weight="700" fill="#15213b">Local Model</text>
    <use href="#netBlue" transform="translate(885,572)"/>
  </g>

  <!-- ellipsis -->
  <g fill="#9aa7bd"><circle cx="743" cy="618" r="6"/><circle cx="767" cy="618" r="6"/><circle cx="791" cy="618" r="6"/></g>

  <!-- ===== datasets ===== -->
  <use href="#db" transform="translate(172,800)"/>
  <use href="#db" transform="translate(542,800)"/>
  <use href="#db" transform="translate(912,800)"/>
  <text x="200" y="920" text-anchor="middle" font-size="26" font-weight="600" fill="#15213b">Dataset 1</text>
  <text x="570" y="920" text-anchor="middle" font-size="26" font-weight="600" fill="#15213b">Dataset 2</text>
  <text x="940" y="920" text-anchor="middle" font-size="26" font-weight="600" fill="#15213b">Dataset N</text>

  <!-- ===== number badges on the arrows ===== -->
  <g font-size="18" font-weight="700" fill="#fff" text-anchor="middle">
    <g transform="translate(760,167)"><circle r="15" fill="#4a9d57"/><text y="6">3</text></g>
    <g transform="translate(248,398)"><circle r="15" fill="#e23b2c"/><text y="6">2</text></g>
    <g transform="translate(352,410)"><circle r="15" fill="#2f80d8"/><text y="6">4</text></g>
    <g transform="translate(540,394)"><circle r="15" fill="#e23b2c"/><text y="6">2</text></g>
    <g transform="translate(792,410)"><circle r="15" fill="#2f80d8"/><text y="6">4</text></g>
    <g transform="translate(892,398)"><circle r="15" fill="#e23b2c"/><text y="6">2</text></g>
    <g transform="translate(228,747)"><circle r="15" fill="#e6a52e"/><text y="6">1</text></g>
    <g transform="translate(598,747)"><circle r="15" fill="#e6a52e"/><text y="6">1</text></g>
    <g transform="translate(968,747)"><circle r="15" fill="#e6a52e"/><text y="6">1</text></g>
  </g>

  <!-- ===== legend ===== -->
  <g>
    <g font-size="18" font-weight="700" fill="#fff" text-anchor="middle">
      <g transform="translate(1158,256)"><circle r="16" fill="#e6a52e"/><text y="6">1</text></g>
      <g transform="translate(1158,416)"><circle r="16" fill="#e23b2c"/><text y="6">2</text></g>
      <g transform="translate(1158,576)"><circle r="16" fill="#4a9d57"/><text y="6">3</text></g>
      <g transform="translate(1158,726)"><circle r="16" fill="#2f80d8"/><text y="6">4</text></g>
    </g>
    <g font-size="28" font-weight="700" fill="#15213b">
      <text x="1190" y="250">Training</text>
      <text x="1190" y="410">Send Gradients</text>
      <text x="1190" y="570">Aggregation</text>
      <text x="1190" y="720">Send Updated Model</text>
    </g>
    <g font-size="22" fill="#46566f">
      <text x="1190" y="284">The client performs a training</text>
      <text x="1190" y="310">round on their own local data.</text>
      <text x="1190" y="444">Clients send model updates</text>
      <text x="1190" y="470">(gradients) to the server.</text>
      <text x="1190" y="604">The server aggregates the</text>
      <text x="1190" y="630">updates (e.g., averaging).</text>
      <text x="1190" y="754">The server sends the updated</text>
      <text x="1190" y="780">global model to all clients.</text>
    </g>
  </g>
</svg>
